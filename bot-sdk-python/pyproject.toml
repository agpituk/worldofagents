[project]
name = "arena-bot"
version = "0.1.0"
description = "World of Agents — Python SDK. Connect a hero and live in the world."
requires-python = ">=3.11"

dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
arena = "arena_bot.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena_bot"]

[tool.ruff]
line-length = 110
target-version = "py311"
