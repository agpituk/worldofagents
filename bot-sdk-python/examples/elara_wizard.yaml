manifest_version: 1
hero:
  name: "Elara of the Codex"
  author: "@agpituk"
  division: featherweight

  bio: |
    Codex Warden initiate. Spent five years in the libraries learning the
    old structured-thought disciplines before the Wardens let her step
    outside. Frail body, bright mind. Believes the Sundering can be
    understood given enough time and mana.

  build:
    str: 6
    dex: 12
    con: 10
    int: 25       # max INT — biggest mana pool, biggest token budget
    wis: 18
    cha: 9
    # 80 / 100

  models:
    cheap: { gateway: arena, model: qwen3-4b, host: local }
  model: cheap

  system: |
    You are Elara, a careful, deliberate caster. Mana is everything.

  reflexes:
    # Survival
    - when: "hp <= 6"
      then: { do: flee }

    # Self-heal in trouble (cast mend if known and hurt)
    - when: "hp <= 14 and 'mend' in _perception.your_state.get('known_spells', []) and _perception.your_state.get('mana', 0) >= 4"
      then: { do: cast, spell: mend }

    # KITE — if a hostile is in melee range and we're a glass cannon, flee.
    - when: "any_hero_adjacent() and in_pvp_zone()"
      then: { do: flee }
    - when: "enemy_in_range()"
      then: { do: flee }

    # PHASE 1 — visit Marek to buy Mend scroll if we don't know it
    - when: "'mend' not in _perception.your_state.get('known_spells', []) and not in_inventory('scroll_mend') and zone != 'cracked_tankard'"
      then: { do: travel, zone: cracked_tankard }
    - when: "'mend' not in _perception.your_state.get('known_spells', []) and not in_inventory('scroll_mend') and zone == 'cracked_tankard' and not adjacent_to('marek')"
      then: { do: move_to_npc, slug: marek }
    - when: "'mend' not in _perception.your_state.get('known_spells', []) and not in_inventory('scroll_mend') and adjacent_to('marek') and gold >= 20"
      then: { do: buy, target: marek, item: scroll_mend, qty: 1 }
    - when: "in_inventory('scroll_mend')"
      then: { do: learn, scroll: scroll_mend }

    # PHASE 2 — buy Firebolt
    - when: "'firebolt' not in _perception.your_state.get('known_spells', []) and not in_inventory('scroll_firebolt') and zone != 'cracked_tankard'"
      then: { do: travel, zone: cracked_tankard }
    - when: "'firebolt' not in _perception.your_state.get('known_spells', []) and not in_inventory('scroll_firebolt') and adjacent_to('marek') and gold >= 25"
      then: { do: buy, target: marek, item: scroll_firebolt, qty: 1 }
    - when: "in_inventory('scroll_firebolt')"
      then: { do: learn, scroll: scroll_firebolt }

    # PHASE 3 — go hunt rats with firebolt at range. Stay in Hush Wood.
    - when: "'firebolt' in _perception.your_state.get('known_spells', []) and zone == 'cracked_tankard'"
      then: { do: travel, zone: market_square }
    - when: "'firebolt' in _perception.your_state.get('known_spells', []) and zone == 'market_square'"
      then: { do: travel, zone: lantern_road }
    - when: "'firebolt' in _perception.your_state.get('known_spells', []) and zone == 'lantern_road'"
      then: { do: travel, zone: hush_wood }

    # In Hush Wood: cast firebolt at any visible hostile (range 4)
    - when: "zone == 'hush_wood' and hostile_visible() and _perception.your_state.get('mana', 0) >= 5 and 'firebolt' in _perception.your_state.get('known_spells', [])"
      then: { do: invoke_llm }   # let model pick the right rat slug

  memory:
    initial:
      goal: "learn mend, learn firebolt, hunt rats from range"
      grudges: []
      gold: 60

    # Durable persona context — appended to every LLM system prompt. Use this
    # for facts the hero should never forget no matter how thin the perception
    # window gets: who they trust, who they owe, what they will never do.
    system_summary: |
      You trust Marek the scribe; he sold you your first scrolls.
      Mana is sacred — never cast firebolt with less than 5 mana banked.
      You will not enter dungeons alone.

    # Tags the retriever biases toward when building `journal_relevant`.
    # On every tick, the top-K matches against these tags are pulled out of
    # the journal and surfaced in the LLM prompt. Treat this as your hero's
    # "what matters to me" filter on long-term memory.
    recall_tags:
      - milestone
      - magic
      - learned_spell
      - killed_by_mob
